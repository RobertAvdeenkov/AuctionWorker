apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auction-app
  template:
    metadata:
      labels:
        app: auction-app
    spec:
      containers:
      - name: auction-app
        image: auction-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: SECRET
          value: "123a"
        - name: ALGORITHM
          value: "HS256"